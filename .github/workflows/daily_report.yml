name: Daily CCMS Wattage Report

on:
  schedule:
    # Runs daily at 09:00 AM IST (Asia/Kolkata = UTC+5:30 -> 03:30 UTC).
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate Excel report without sending email"
        required: false
        type: boolean
        default: false
      force:
        description: "Bypass duplicate-send protection for the target date"
        required: false
        type: boolean
        default: false
      report_date:
        description: "Override report date (YYYY-MM-DD); leave empty for today in Asia/Kolkata"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  send-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Restore duplicate-send state cache
        uses: actions/cache/restore@v4
        with:
          path: logs/send_state.json
          key: ccms-send-state-${{ github.run_id }}
          restore-keys: |
            ccms-send-state-

      - name: Materialize Google credentials from GitHub Secrets
        shell: bash
        env:
          EMAIL_TRANSPORT: ${{ secrets.EMAIL_TRANSPORT || 'smtp' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          mkdir -p credentials logs reports
          TRANSPORT="$(printf '%s' "${EMAIL_TRANSPORT}" | tr '[:upper:]' '[:lower:]' | xargs)"

          if [[ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > credentials/service_account.json
            echo "USE_SERVICE_ACCOUNT=true" >> "$GITHUB_ENV"
          else
            echo "USE_SERVICE_ACCOUNT=false" >> "$GITHUB_ENV"
          fi

          if [[ -n "${GOOGLE_TOKEN_JSON}" ]]; then
            printf '%s' "${GOOGLE_TOKEN_JSON}" > credentials/token.json
          else
            if [[ "${TRANSPORT}" != "smtp" ]]; then
              echo "Error: Secret GOOGLE_TOKEN_JSON is missing (required when EMAIL_TRANSPORT='${TRANSPORT}')." >&2
              exit 1
            fi
            if [[ -z "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]]; then
              echo "Error: Secret GOOGLE_SERVICE_ACCOUNT_JSON is missing (needed for read-only Google Sheets access)." >&2
              exit 1
            fi
          fi

          if [[ -n "${GOOGLE_CREDENTIALS_JSON}" ]]; then
            printf '%s' "${GOOGLE_CREDENTIALS_JSON}" > credentials/credentials.json
          fi

      - name: Run CCMS Wattage Report pipeline
        shell: bash
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_TAB_NAME: AppSheet_Survey
          GOOGLE_CREDENTIALS_FILE: credentials/credentials.json
          GOOGLE_TOKEN_FILE: credentials/token.json
          GOOGLE_SHEETS_SERVICE_ACCOUNT_FILE: ${{ env.USE_SERVICE_ACCOUNT == 'true' && 'credentials/service_account.json' || '' }}
          EMAIL_TRANSPORT: ${{ secrets.EMAIL_TRANSPORT || 'smtp' }}
          GMAIL_THREAD_ID: ${{ secrets.GMAIL_THREAD_ID }}
          SMTP_THREAD_SUBJECT: ${{ secrets.SMTP_THREAD_SUBJECT }}
          SMTP_THREAD_MESSAGE_ID: ${{ secrets.SMTP_THREAD_MESSAGE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'True' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          EMAIL_SUBJECT_TEMPLATE: ${{ vars.EMAIL_SUBJECT_TEMPLATE }}
          EMAIL_BODY_TEMPLATE: ${{ vars.EMAIL_BODY_TEMPLATE }}
          TIMEZONE: Asia/Kolkata
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=("--dry-run")
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS+=("--force")
          fi
          if [[ -n "${{ inputs.report_date }}" ]]; then
            ARGS+=("--date" "${{ inputs.report_date }}")
          fi
          python app.py ${ARGS[@]+"${ARGS[@]}"}

      - name: Save duplicate-send state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: logs/send_state.json
          key: ccms-send-state-${{ github.run_id }}

      - name: Upload generated report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccms-report-and-logs-${{ github.run_id }}
          path: |
            reports/*.xlsx
            logs/*.log
            logs/send_state.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up credential files from runner
        if: always()
        run: rm -f credentials/token.json credentials/credentials.json credentials/service_account.json
